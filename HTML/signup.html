<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - BookShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .signup-box {
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 100%;
    }

    .signup-box h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
      font-size: 1.6rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input {
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
      width: 100%;
    }

    input:focus {
      outline: 2px solid #7a63f1;
      border-color: #7a63f1;
    }

    button {
      padding: 0.75rem;
      background-color: #7a63f1;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #5c47d6;
    }

    .login-link {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .login-link a {
      color: #0051ff;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .signup-box {
        padding: 1.5rem;
      }

      .signup-box h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="signup-box">
    <h2>Create an Account</h2>
    <form id="signupForm">
      <input type="text" id="signupName" placeholder="Full Name" required>
      <input type="email" id="signupEmail" placeholder="Email Address" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p class="login-link">Already have an account? <a href="index.html">Log In</a></p>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("signupName").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();

      if (!name || !email || !password) {
        alert("Please fill in all fields.");
        return;
      }

      const user = { name, email, password };
      localStorage.setItem("bookshopUser", JSON.stringify(user));
      alert("Account created successfully! Please log in.");
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
