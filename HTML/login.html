<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | BookShop</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f0f4ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 1rem;
    }

    .login-wrapper {
      background: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
    }

    .login-wrapper h2 {
      margin-bottom: 1.5rem;
      font-size: 1.6rem;
      color: #333;
      text-align: center;
    }

    .login-wrapper input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 0.6rem 0;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    .login-wrapper input:focus {
      outline: 2px solid #7a63f1;
      border-color: #7a63f1;
    }

    .login-wrapper button {
      width: 100%;
      margin-top: 1rem;
      background-color: #7a63f1;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 0.5rem;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-wrapper button:hover {
      background-color: #5c47d6;
    }

    .login-error {
      color: #d32f2f;
      margin-top: 1rem;
      display: none;
      text-align: center;
      font-size: 0.95rem;
    }

    .login-wrapper p {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .login-wrapper a {
      color: #0051ff;
      text-decoration: none;
    }

    .login-wrapper a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-wrapper {
        padding: 1.5rem;
      }

      .login-wrapper h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <h2>Login to BookShop</h2>
    <form id="loginForm" autocomplete="on">
      <input type="email" id="loginEmail" placeholder="Email Address" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Login</button>
      <p id="loginError" class="login-error">Invalid credentials. Try again.</p>
      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const errorMsg = document.getElementById("loginError");

      const storedUser = JSON.parse(localStorage.getItem("bookshopUser"));

      if (storedUser && storedUser.email === email && storedUser.password === password) {
        window.location.href = "home.html";
      } else {
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
